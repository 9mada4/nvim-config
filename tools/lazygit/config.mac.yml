os:
  editPreset: "nvim"

customCommands:
  - key: "R"
    context: "global"
    description: "Pull with rebase"
    command: "git pull --rebase"
    output: log

  - key: "G"
    context: "files"
    description: "Open editor with rule-based message; generate LLM summary in background"
    output: terminal
    command: |
      MSG="$(NVIM_COMMIT_MSG_MODE=rule nvim --clean --headless +'lua dofile(vim.fn.stdpath("config") .. "/scripts/generate-commit-msg.lua")' +qa 2>/dev/null)"
      STATUS=$?
      [ "$STATUS" -eq 0 ] || { echo "failed to generate commit message"; exit 1; }
      [ -n "$MSG" ] || { echo "failed to generate commit message"; exit 1; }
      NVIM_GENERATE_COMMIT_MSG=1 git -c core.editor=nvim commit -e -m "$MSG"
