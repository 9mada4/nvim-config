os:
  editPreset: "nvim"

customCommands:
  - key: "R"
    context: "global"
    description: "Pull with rebase"
    command: "git pull --rebase"
    output: log

  - key: "G"
    context: "files"
    description: "Open commit editor and generate message in background"
    output: terminal
    command: |
      NVIM_GENERATE_COMMIT_MSG=1 git -c core.editor=nvim commit
